<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="videogames.css">
    <link rel="stylesheet" href="n-rgeia.css">
    <title>N-rgeia</title>
</head>
<body>
    <div class="backgrounds">
        <video autoplay loop muted id="videogamesVideo">
            <source src="Backgrounds/Prueba.mp4" type="video/mp4">
        </video>
    </div>

    <header>
        <label for="btn-sections">SECCIONES</label>
        <a href="mainAboutMe.html">SOBRE MÍ</a>
        <label for="btn-contact">CONTACTO</label>
    </header>
    <input type="checkbox" name="" id="btn-sections">

    <div class="menuContainer">
        <label for="btn-sections" class="labelContainer">
            <div class="touch"></div>
        </label>
        <div class="menu">
            <h2>ELIGE UNA SECCIÓN</h2>
            <nav>
                <a href="scape.html">VIDEOJUEGOS</a>
                <a href="digitalDesign.html">DISEÑO DÍGITAL</a>
                <a href="">MODELOS 3D</a>
            </nav>


            <label for="btn-contact">CONTACTO</label>
        </div>
    </div>

    <input type="checkbox" name="" id="btn-contact">
    <div class="contactContainer">
        <div class="contact">
            <h1>CONTÁCTAME POR UN VIDEOJUEGO</h1>

            <div class="dataContainer">
                <div class="nameContainer">
                    <input type="text" placeholder="NOMBRE" class="name">
                    <input type="text" placeholder="APELLIDO" class="lastname">
                </div>

                <div class="emailContainer">
                    <input type="email" placeholder="example@e-mail.com" class="email">
                </div>

                <div class="descriptionContainer">
                    <input type="text" placeholder="DESCRIPCIÓN" class="description">
                </div>

                <div class="buttonsContainer">
                    <label for="btn-contact" class="cancel">Cancelar</label>
                    <label for="btn-contact" class="send">Enviar</label>
                </div>
            </div>
        </div>
    </div>

    <div class="imgTest" id="imageContainer"></div>
    <video id="nRgeiaVideo" controls>
        <source src="vids/N-rgeia.mp4" type="video/mp4">
    </video>


    
    <div class="container">
        <div class="effect"></div>

        <div class="letters">

            <div data-aos="fade-left"
                 data-aos-easing="linear"
                 data-aos-duration="1500"
                class="imageDescription">
                N-RGEIA ES UN JUEGO DE PLATAFORMAS 2-D DONDE DEBES SOBREVIVIR Y DETENER A UNA CIENTIFICA MALVADAA UN MUNDO PARALLELO .
            </div>
            <div data-aos="fade-right"
                 data-aos-easing="linear"
                 data-aos-duration="1500"
                    class="imageTitle">
                <h2>N-RGEÍA</h2>
                <h4>GÉNERO: ACCIÓN, PLATAFORMAS, AVENTURA</h4>
                <h4>FECHA: 2025</h4>
            </div>
            <div  class="imageContact">
                <label for="btn-contact">
                    CONCTACTAR POR UN VIDEOJUEGO
                </label>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <!-- ARCHIVO EXTERNO PARA NAVEGACIÓN - gameNavigation.js controla todo -->
    <script src="gameNavigation.js"></script>
    <script>
        AOS.init();
    </script>
    <script>
        // Script específico para N-rgeia con video
        document.addEventListener('DOMContentLoaded', function() {
            const imageContainer = document.getElementById('imageContainer');
            const video = document.getElementById('nRgeiaVideo');
            let hasVideoStarted = false;
            
            // Función para cambiar de imagen a video después de 5 segundos
            function startVideoTransition() {
                if (hasVideoStarted) return;
                hasVideoStarted = true;
                
                // Marcar que el video está reproduciéndose
                if (window.gameNavigation && window.gameNavigation.setVideoPlaying) {
                    window.gameNavigation.setVideoPlaying(true);
                }
                
                // Cambiar la imagen por el video
                imageContainer.style.display = 'none';
                video.style.display = 'block';
                video.play();
                
                // Cuando termine el video, navegar a la siguiente página
                video.addEventListener('ended', function() {
                    // Marcar que el video terminó
                    if (window.gameNavigation && window.gameNavigation.setVideoPlaying) {
                        window.gameNavigation.setVideoPlaying(false);
                    }
                    
                    // Navegar a la siguiente página
                    if (window.gameNavigation && window.gameNavigation.navigateToNextPage) {
                        window.gameNavigation.navigateToNextPage();
                    }
                });
            }
            
            // Iniciar transición después de 5 segundos
            setTimeout(startVideoTransition, 5000);
        });
    </script>
</body>
</html>
